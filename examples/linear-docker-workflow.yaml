# Example: Autonomous Linear Issue to Docker Build & PR Workflow
# Demonstrates OpenAIDLC resolving a bug ticket, testing in Docker, and creating a PR.

version: "1.0"
workflow_name: "linear-bug-fix-to-docker-pr"

trigger:
  event: "linear:issue.labeled"
  filter:
    label: "ai-fix"

steps:
  - id: "triage"
    name: "Parse Linear Ticket"
    model_tier: "tier1_fast"
    action: "linear.get_issue"
    params:
      include_comments: true

  - id: "ast_slicing"
    name: "Local Codebase Exploration"
    model_tier: "tier0_local"
    action: "treesitter.slice_ast"
    params:
      query_symbols: ["${triage.output.relevant_symbols}"]

  - id: "plan_synthesis"
    name: "Architectural Patch Design"
    model_tier: "tier2_frontier"
    action: "synthesize_solution"
    pause_for_human_approval: true

  - id: "worktree_patch"
    name: "Apply Patch in Isolated Worktree"
    model_tier: "tier0_local"
    action: "git.worktree_apply"
    params:
      branch: "fix/linear-${triage.output.issue_key}"

  - id: "docker_test"
    name: "Run Test Suite in Clean Container"
    model_tier: "tier0_local"
    action: "docker.run_container"
    params:
      image: "node:20-alpine"
      command: "npm test"

  - id: "publish"
    name: "Create Pull Request & Notify"
    model_tier: "tier1_fast"
    action: "github.create_pr"
    params:
      title: "fix: ${triage.output.issue_title}"
      body: "Resolves ${triage.output.issue_url}\n\nAutomated fix generated by OpenAIDLC."
